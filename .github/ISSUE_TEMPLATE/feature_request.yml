name: Feature request
description: Suggest an improvement to an existing game or to the app itself
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What is missing or frustrating today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like instead?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have considered
